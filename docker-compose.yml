services:
  db:
    image: postgres:16-alpine
    container_name: aievo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aievo
      POSTGRES_PASSWORD: aievo
      POSTGRES_DB: aievo
    ports:
      # Loopback only: the database is never exposed to the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - aievo-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aievo -d aievo']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  aievo-pgdata:
